<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Receipt Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Copy ALL your CSS from your previous HTML file here */
    /* I'm showing the essential parts, but use your full CSS */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f1923;
      --ink2: #4a5568;
      --line: #e2e8f2;
      --bg: #f0f4f9;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-d: #1d4ed8;
      --success: #059669;
      --danger: #dc2626;
      --warn: #d97706;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.07);
      --shadow-lg: 0 8px 30px rgba(0,0,0,.10);
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
      --transition: 160ms ease;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Copy ALL your existing styles here */
    /* ... (paste all your CSS from previous HTML) ... */
  </style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="20" height="20" rx="5" fill="#2563eb"/>
      <path d="M5 7h10M5 10h7M5 13h5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    Receipt Generator
  </div>
  <div class="user-badge">
    <span class="dot" id="userDot"></span>
    <span id="userEmail">Loading...</span>
  </div>
</header>

<main class="main">
  <div class="grid" id="formView">
    <!-- Left: Form -->
    <div class="card">
      <div class="card-head">
        <div class="icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1.447.894L8 13.118l-3.553 1.776A1 1 0 0 1 3 14V2z"/></svg>
        </div>
        <h2>Generate Receipt</h2>
      </div>
      <div class="card-body">
        <form id="receiptForm" novalidate>
          <div class="field">
            <label>Customer</label>
            <div class="s-dropdown" id="sDropdown">
              <div class="s-trigger" id="sTrigger" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false">
                <span id="sTriggerLabel">Loading customers...</span>
                <svg class="chevron" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div class="s-panel" id="sPanel" role="listbox">
                <input class="s-search" id="sSearch" type="text" placeholder="Search by name or ID…" autocomplete="off">
                <div class="s-list" id="sList"></div>
              </div>
            </div>
            <div id="customerHint" class="hint"></div>
          </div>

          <div class="field">
            <label>Contact Number</label>
            <input id="contactNumber" type="text" readonly placeholder="Auto-filled from customer">
          </div>

          <div class="field">
            <label>Amount</label>
            <div class="amount-wrap">
              <span class="currency">₹</span>
              <input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
            </div>
          </div>

          <div class="field">
            <label>Notes <span style="font-weight:400;text-transform:none;font-size:11px;">(optional)</span></label>
            <textarea id="notes" placeholder="Add any remarks…"></textarea>
          </div>

          <div class="field" style="margin-top:20px;">
            <button class="btn btn-primary" id="generateBtn" type="submit">Generate Receipt</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Right: Last receipt -->
    <div class="card">
      <div class="card-head">
        <div class="icon" style="background:#f0fdf4; color:var(--success);">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z"/></svg>
        </div>
        <h2>Last Receipt (this session)</h2>
      </div>
      <div id="lastArea" class="last-receipt">
        <p class="placeholder-text">No receipt generated yet.</p>
      </div>
    </div>
  </div>

  <!-- Result section -->
  <div id="resultSection" style="display: none;">
    <div class="card">
      <div class="card-head">
        <div class="icon" style="background:#f0fdf4; color:var(--success);">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z"/></svg>
        </div>
        <h2>Receipt Generated</h2>
      </div>
      <div class="card-body">
        <div id="resultMeta"></div>
        <div class="action-bar" id="resultActions"></div>
        <div id="previewWrap" class="preview-wrap"></div>
        <button class="btn btn-ghost" onclick="resetForm()">← Generate Another Receipt</button>
      </div>
    </div>
  </div>
</main>

<div id="overlay">
  <div class="spinner"></div>
  <div class="overlay-label">Generating receipt…</div>
</div>

<div id="toast"></div>

<script>
// ============================================================
//  CONFIGURATION
// ============================================================
// REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT URL
const API_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE";

// ============================================================
//  API CALL FUNCTION
// ============================================================
async function callAPI(action, data = null) {
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      mode: 'cors',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        action: action,
        data: data
      })
    });
    
    const result = await response.json();
    
    if (!result.success) {
      throw new Error(result.error || 'API call failed');
    }
    
    return result.data;
  } catch (error) {
    console.error(`API Error (${action}):`, error);
    throw error;
  }
}

// ============================================================
//  STATE
// ============================================================
let _customers = [];
let _filtered = [];
let _selected = null;
let _dropOpen = false;

// ============================================================
//  UTILITIES
// ============================================================
function showOverlay(show) {
  document.getElementById('overlay').style.display = show ? 'flex' : 'none';
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type === 'success' ? 'success' : 'error';
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 3500);
}

function setText(el, val) {
  if (typeof el === 'string') el = document.getElementById(el);
  if (el) el.textContent = val;
}

function makeLink(text, href, classNames, target) {
  const a = document.createElement('a');
  a.textContent = text;
  a.href = href;
  a.className = classNames || '';
  a.target = target || '_blank';
  a.rel = 'noopener noreferrer';
  return a;
}

function extractFileId(url) {
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m2 ? m2[1] : null;
}

// ============================================================
//  AUTH
// ============================================================
async function loadUserEmail() {
  try {
    const email = await callAPI('getUserEmail');
    if (email && email !== "null" && email !== "") {
      setText('userEmail', email);
      document.getElementById('userDot').classList.add('authenticated');
    } else {
      setText('userEmail', 'Guest Mode');
    }
  } catch (error) {
    console.error('Auth error:', error);
    setText('userEmail', 'Guest Mode');
    showToast('Running in guest mode', 'success');
  }
}

// ============================================================
//  CUSTOMER DROPDOWN
// ============================================================
async function loadCustomers() {
  setText('sTriggerLabel', 'Loading customers…');
  try {
    _customers = await callAPI('getCustomers');
    _filtered = _customers;
    setText('sTriggerLabel', _customers.length ? '— Select customer —' : 'No customers found');
    renderOptions();
  } catch (err) {
    setText('sTriggerLabel', 'Failed to load');
    showToast('Failed to load customers: ' + (err.message || err), 'error');
  }
}

function renderOptions() {
  const list = document.getElementById('sList');
  list.innerHTML = '';

  if (_filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 's-empty';
    empty.textContent = 'No customers match your search.';
    list.appendChild(empty);
    return;
  }

  _filtered.forEach(c => {
    const opt = document.createElement('div');
    opt.className = 's-opt' + (_selected && _selected.id === c.id ? ' active' : '');
    opt.setAttribute('role', 'option');
    opt.setAttribute('data-id', c.id);

    const name = document.createElement('span');
    name.textContent = c.name;

    const id = document.createElement('span');
    id.className = 'opt-id';
    id.textContent = c.id + (c.contact ? ' · ' + c.contact : '');

    opt.appendChild(name);
    opt.appendChild(id);

    opt.addEventListener('mousedown', (e) => {
      e.preventDefault();
      selectCustomer(c);
    });

    list.appendChild(opt);
  });
}

function selectCustomer(c) {
  _selected = c;
  setText('sTriggerLabel', c.name);
  document.getElementById('contactNumber').value = c.contact || '';
  document.getElementById('customerHint').textContent = 'ID: ' + c.id;
  closeDropdown();
}

function openDropdown() {
  if (_dropOpen) return;
  _dropOpen = true;
  document.getElementById('sTrigger').classList.add('open');
  document.getElementById('sTrigger').setAttribute('aria-expanded', 'true');
  document.getElementById('sPanel').classList.add('open');
  document.getElementById('sSearch').value = '';
  _filtered = _customers;
  renderOptions();
  setTimeout(() => { document.getElementById('sSearch').focus(); }, 50);
}

function closeDropdown() {
  if (!_dropOpen) return;
  _dropOpen = false;
  document.getElementById('sTrigger').classList.remove('open');
  document.getElementById('sTrigger').setAttribute('aria-expanded', 'false');
  document.getElementById('sPanel').classList.remove('open');
}

// ============================================================
//  FORM SUBMISSION
// ============================================================
document.getElementById('receiptForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!_selected) {
    showToast('Please select a customer.', 'error');
    return;
  }

  const rawAmount = parseFloat(document.getElementById('amount').value);
  if (isNaN(rawAmount) || rawAmount <= 0) {
    showToast('Please enter a valid amount greater than 0.', 'error');
    return;
  }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.textContent = 'Generating…';
  showOverlay(true);

  const formData = {
    customerId: _selected.id,
    customerName: _selected.name,
    contactNumber: _selected.contact,
    amount: rawAmount,
    notes: document.getElementById('notes').value.trim() || ''
  };

  try {
    const result = await callAPI('generateReceipt', formData);
    
    showOverlay(false);
    btn.disabled = false;
    btn.textContent = 'Generate Receipt';

    if (result && result.pdfUrl) {
      renderResult({
        receiptId: result.receiptId,
        pdfUrl: result.pdfUrl,
        customerName: formData.customerName,
        customerId: formData.customerId,
        amount: formData.amount,
        notes: formData.notes,
        generatedAt: result.generatedAt,
        generatedBy: result.generatedBy
      });
    } else {
      showToast('Receipt generated but no PDF URL returned.', 'error');
    }
  } catch (err) {
    showOverlay(false);
    btn.disabled = false;
    btn.textContent = 'Generate Receipt';
    showToast('Error: ' + (err.message || 'Could not generate receipt.'), 'error');
  }
});

// ============================================================
//  RENDER RESULT
// ============================================================
function renderResult(res) {
  // Update sidebar
  const last = document.getElementById('lastArea');
  last.innerHTML = '';

  const idBadge = document.createElement('div');
  idBadge.className = 'r-id';
  idBadge.textContent = res.receiptId || '';
  last.appendChild(idBadge);

  const name = document.createElement('div');
  name.className = 'r-name';
  name.textContent = res.customerName || '';
  last.appendChild(name);

  const amt = document.createElement('div');
  amt.className = 'r-amount';
  amt.textContent = '₹' + parseFloat(res.amount).toFixed(2);
  last.appendChild(amt);

  const time = document.createElement('div');
  time.className = 'r-time';
  time.textContent = res.generatedAt || '';
  last.appendChild(time);

  if (res.pdfUrl) {
    last.appendChild(makeLink('Open PDF ↗', res.pdfUrl));
  }

  // Show result section
  document.getElementById('resultSection').style.display = 'block';

  // Result meta
  const meta = document.getElementById('resultMeta');
  meta.innerHTML = '';
  meta.className = 'result-meta';

  const title = document.createElement('div');
  title.className = 'rm-title';
  title.textContent = '✅ Receipt Generated Successfully';
  meta.appendChild(title);

  const grid = document.createElement('div');
  grid.className = 'rm-grid';

  const fields = [
    ['Receipt ID', res.receiptId || '—'],
    ['Customer', res.customerName || '—'],
    ['Amount', '₹' + parseFloat(res.amount).toFixed(2)],
    ['Generated', res.generatedAt || '—'],
    ['Generated By', res.generatedBy || '—'],
    ['Notes', res.notes || '—']
  ];

  fields.forEach(f => {
    const row = document.createElement('div');
    row.className = 'rm-row';

    const lbl = document.createElement('div');
    lbl.className = 'rm-label';
    lbl.textContent = f[0];

    const val = document.createElement('div');
    val.className = 'rm-val';
    val.textContent = f[1];

    row.appendChild(lbl);
    row.appendChild(val);
    grid.appendChild(row);
  });
  meta.appendChild(grid);

  // Action bar
  const actions = document.getElementById('resultActions');
  actions.innerHTML = '';
  if (res.pdfUrl) {
    const openLink = makeLink('Open PDF in new tab', res.pdfUrl, 'btn-link btn-link-primary');
    actions.appendChild(openLink);
  }

  // PDF preview
  const wrap = document.getElementById('previewWrap');
  wrap.innerHTML = '';
  const fileId = res.pdfUrl ? extractFileId(res.pdfUrl) : null;

  if (fileId) {
    const iframe = document.createElement('iframe');
    iframe.src = 'https://drive.google.com/file/d/' + fileId + '/preview';
    iframe.title = 'Receipt PDF preview';
    iframe.setAttribute('allowfullscreen', '');
    wrap.appendChild(iframe);
  } else {
    const fallback = document.createElement('div');
    fallback.className = 'preview-fallback';
    fallback.textContent = 'Preview unavailable. Use the link above to open the PDF.';
    wrap.appendChild(fallback);
  }

  setTimeout(() => {
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 120);
}

// ============================================================
//  RESET
// ============================================================
function resetForm() {
  _selected = null;
  document.getElementById('receiptForm').reset();
  setText('sTriggerLabel', '— Select customer —');
  document.getElementById('contactNumber').value = '';
  document.getElementById('customerHint').textContent = '';
  document.getElementById('generateBtn').disabled = false;
  document.getElementById('generateBtn').textContent = 'Generate Receipt';
  document.getElementById('resultSection').style.display = 'none';
  closeDropdown();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
//  EVENT LISTENERS
// ============================================================
document.getElementById('sTrigger').addEventListener('click', () => {
  _dropOpen ? closeDropdown() : openDropdown();
});

document.getElementById('sTrigger').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDropdown(); }
  if (e.key === 'Escape') closeDropdown();
});

document.getElementById('sSearch').addEventListener('input', () => {
  const term = document.getElementById('sSearch').value.toLowerCase();
  _filtered = _customers.filter(c => 
    c.name.toLowerCase().includes(term) || 
    c.id.toLowerCase().includes(term)
  );
  renderOptions();
});

document.getElementById('sSearch').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.stopPropagation(); closeDropdown(); }
});

document.addEventListener('mousedown', (e) => {
  if (!document.getElementById('sDropdown').contains(e.target)) {
    closeDropdown();
  }
});

// ============================================================
//  INIT
// ============================================================
window.addEventListener('load', async () => {
  await loadUserEmail();
  await loadCustomers();
});
</script>
</body>
</html>
